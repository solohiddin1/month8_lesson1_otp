{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block header %}Forgot Password{% endblock %}

{% block content %}
<h2>Forgot Password</h2>
<p style="text-align: center; color: #666; margin-bottom: 20px;">Enter your email to receive a password reset link</p>

<form id="forgotForm">
    <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    
    <button type="submit">Send Reset Link</button>
</form>

<p id="message"></p>

<div class="links">
    <p>Remember your password? <a href="{% url 'login_existing_user_view' %}">Login here</a></p>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const messageEl = document.getElementById("message");
    messageEl.innerText = "";

    try {
        const response = await fetch("{% url 'forgot_password' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        if (response.ok && data.reset_link) {
            messageEl.style.color = "green";
            messageEl.innerText = "Check your email for reset link!";
        } else {
            messageEl.style.color = "red";
            messageEl.innerText = data.error || "Request failed!";
        }
    } catch (err) {
        messageEl.style.color = "red";
        messageEl.innerText = "Something went wrong!";
    }
});

</script>
{% endblock %}
