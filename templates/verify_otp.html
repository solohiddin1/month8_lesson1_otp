{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block header %}Verify OTP{% endblock %}

{% block content %}
<h2>Verify Your Email</h2>
<p style="text-align: center; color: #666; margin-bottom: 20px;">Enter the OTP code sent to your email</p>

<form id="verifyOtpForm">
    <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    
    <div>
        <label>OTP Code</label>
        <input type="text" id="otp" placeholder="Enter 4-digit code" maxlength="4" pattern="\d{4}" required>
    </div>
    
    <button type="submit">Verify Email</button>
</form>

<p id="message"></p>

<div class="links">
    <p>Didn't receive code? <a href="{% url 'userlogin_view' %}">Resend</a></p>
</div>

<script>
document.getElementById("verifyOtpForm").addEventListener("submit", async function(e) {
    e.preventDefault(); // prevent default form submission

    const email = document.getElementById("email").value;
    const otp = document.getElementById("otp").value;

    try {
        const response = await fetch("{% url 'verify_user_otp' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                email: email,
                otp: otp
            })
        });


        const data = await response.json();

        if (response.ok && data.success) {
            document.getElementById("message").style.color = "green";
            document.getElementById("message").innerText = data.message;
            // optionally redirect after successful verification
            setTimeout(() => { window.location.href = "/change_password_page/"; }, 1500);
        } else {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText = data.message || "Verification failed!";
        }
    } catch (error) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = "Something went wrong!";
        console.error(error);
    }
});
</script>
{% endblock %}
